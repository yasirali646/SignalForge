[project]
name = "signalforge-api"
version = "1.0.0"
description = "SignalForge API — competitive intelligence from the live web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "PyJWT>=2.10.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
